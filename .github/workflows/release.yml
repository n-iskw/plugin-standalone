name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_path: "build/PluginStandalone_artefacts/Release/Plugin Standalone.app"
            artifact_name: PluginStandalone-macOS
          - os: windows-latest
            artifact_path: "build/PluginStandalone_artefacts/Release/Plugin Standalone.exe"
            artifact_name: PluginStandalone-Windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - "build/PluginStandalone_artefacts/Release/Plugin Standalone.app"

      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: zip -r PluginStandalone-macOS.zip "build/PluginStandalone_artefacts/Release/Plugin Standalone.app"

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "build/PluginStandalone_artefacts/Release/Plugin Standalone.exe" -DestinationPath PluginStandalone-Windows.zip
        shell: pwsh

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}.zip
