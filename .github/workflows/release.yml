name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - "build/PluginStandalone_artefacts/Release/Plugin Standalone.app"

      - name: DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dmg_tmp
          cp -r "build/PluginStandalone_artefacts/Release/Plugin Standalone.app" dmg_tmp/
          ln -s /Applications dmg_tmp/Applications
          hdiutil create -volname "Plugin Standalone" -srcfolder dmg_tmp -ov -format UDZO PluginStandalone-macOS.dmg

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "build/PluginStandalone_artefacts/Release/Plugin Standalone.exe" -DestinationPath PluginStandalone-Windows.zip
        shell: pwsh

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PluginStandalone-macOS.dmg
            PluginStandalone-Windows.zip
