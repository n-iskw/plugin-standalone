name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: "build/PluginStandalone_artefacts/Release/Plugin Standalone.app"
          - os: windows-latest
            artifact: "build/PluginStandalone_artefacts/Release/Plugin Standalone.exe"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PluginStandalone-${{ matrix.os }}
          path: ${{ matrix.artifact }}
